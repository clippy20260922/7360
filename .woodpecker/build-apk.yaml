when:
  - event: push
    branch: master

steps:
  - name: build-android-apk
    image: ghcr.io/gmeligio/flutter-android:3.47.9
    volumes:
      - /home/dd/volume-woodpecker-1:/volume1
    commands:
      - cd client7360
      - flutter --version
      - flutter pub get
      - flutter build apk --target-platform android-arm64
      - cp build/app/outputs/flutter-apk/app-release.apk /volume1/app-release-${CI_PIPELINE_NUMBER}.apk
